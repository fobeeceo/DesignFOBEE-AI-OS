# DesignFOBEE AI Headquarters — Docker Compose 오케스트레이션.
# 규칙(CEO-CHARTER.md §Docker 규칙): Docker Compose 기반으로만 구축, docker run 미사용,
# 모든 서비스는 AI-HQ 폴더 아래에서 관리(=이 파일이 단일 오케스트레이션 진입점).
#
# 사용법 (repo 루트에서):
#   docker compose -f AI-HQ/docker-compose.yml build
#   docker compose -f AI-HQ/docker-compose.yml up web
#   docker compose -f AI-HQ/docker-compose.yml run --rm erp python src/pos_import.py <파일>
#
# Dockerfile은 각 서비스 폴더에 위치(관례: 서비스 코드와 함께 버전관리). 오케스트레이션만 AI-HQ/ 소유.

services:
  web:
    build:
      context: ..
      dockerfile: Dockerfile
    ports:
      - "${WEB_PORT:-3000}:3000" # 호스트 포트 충돌 시 WEB_PORT=3011 docker compose ... up 처럼 오버라이드
    env_file:
      - path: ../.env.local
        required: false # 없어도 기동(미들웨어가 env 없으면 인증 스킵 — 무파괴 원칙)
    restart: unless-stopped

  erp:
    build:
      context: ../content-automation-agent
      dockerfile: Dockerfile
    env_file:
      - path: ../content-automation-agent/.env
        required: false # 없으면 dry-run으로 동작(base_publisher.py 가드레일)
    volumes:
      - ../content-automation-agent/output:/app/output
      - ../content-automation-agent/logs:/app/logs
    profiles: ["tools"] # 상시 기동 아님 — `docker compose run erp ...`로 온디맨드 실행
