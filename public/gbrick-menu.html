<style>
/* Layout: one narrow column for phones. Sticky language bar, category chips, then plain ruled lists with prices on the right. */
:root {
  --bg: #F6F2EE;
  --fg: #1F1B18;
  --muted: #5E554F;
  --rule: #D9D0C8;
  --brick: #A94B25;
  --on-brick: #FFFFFF;
  --font-ko: 'Noto Sans KR', 'Noto Sans JP', 'Noto Sans SC', 'Noto Sans Thai', system-ui, sans-serif;
  --font-ja: 'Noto Sans JP', 'Noto Sans KR', 'Noto Sans SC', 'Noto Sans Thai', system-ui, sans-serif;
  --font-zh: 'Noto Sans SC', 'Noto Sans JP', 'Noto Sans KR', 'Noto Sans Thai', system-ui, sans-serif;
  --font-th: 'Noto Sans Thai', 'Noto Sans KR', 'Noto Sans JP', 'Noto Sans SC', system-ui, sans-serif;
  --font: var(--font-ko);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1C1815; --fg: #F2ECE6; --muted: #B7ABA1; --rule: #3B332D; --brick: #E58A63; --on-brick: #1C1815;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1C1815; --fg: #F2ECE6; --muted: #B7ABA1; --rule: #3B332D; --brick: #E58A63; --on-brick: #1C1815;
  color-scheme: dark;
}
:root[lang="ja"] { --font: var(--font-ja); }
:root[lang="zh"] { --font: var(--font-zh); }
:root[lang="th"] { --font: var(--font-th); }
:root[lang="en"], :root[lang="ko"] { --font: var(--font-ko); }

body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font);
  font-size: 17px;
  line-height: 1.5;
  padding-inline: 16px;
  padding-block: 0 48px;
}
.wrap { max-width: 560px; margin-inline: auto; }
.masthead { padding-block: 28px 16px; border-bottom: 3px solid var(--fg); }
.brand { margin: 0; font-size: 34px; font-weight: 900; letter-spacing: -0.02em; line-height: 1.1; }
.store { margin: 6px 0 0; font-size: 16px; font-weight: 700; color: var(--brick); }
.langbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 2;
  background: var(--bg); border-bottom: 1px solid var(--rule);
  padding-block: 10px;
}
.langs { display: flex; flex-wrap: wrap; gap: 6px; margin: 0; padding: 0; list-style: none; }
.langs button {
  font: inherit; font-size: 15px; font-weight: 700; color: var(--fg);
  background: transparent; border: 1.5px solid var(--rule); border-radius: 999px;
  padding: 7px 14px; min-height: 44px; cursor: pointer;
}
.langs button[aria-pressed="true"] { background: var(--brick); border-color: var(--brick); color: var(--on-brick); }
.jump { display: flex; gap: 8px; overflow-x: auto; margin: 0; padding: 14px 0 4px; list-style: none; scrollbar-width: thin; }
.jump button {
  font: inherit; font-size: 15px; font-weight: 700; color: var(--brick); white-space: nowrap;
  background: transparent; border: 0; border-bottom: 2px solid var(--brick); padding: 6px 2px; min-height: 40px; cursor: pointer;
}
button:focus-visible { outline: 3px solid var(--brick); outline-offset: 2px; }
.cat { margin: 36px 0 4px; font-size: 14px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); scroll-margin-top: 84px; }
.items { margin: 0; padding: 0; list-style: none; }
.item { display: grid; grid-template-columns: minmax(0, 1fr) auto; column-gap: 16px; row-gap: 2px; align-items: start; padding-block: 14px; border-bottom: 1px solid var(--rule); }
.item > * { grid-column: 1; min-width: 0; }
.name { font-size: 19px; font-weight: 700; line-height: 1.35; overflow-wrap: anywhere; }
.ko { font-size: 15px; color: var(--muted); font-family: var(--font-ko); }
.desc { font-size: 15px; color: var(--muted); overflow-wrap: anywhere; }
.season { font-size: 14px; font-weight: 700; color: var(--brick); }
.prices { grid-column: 2; grid-row: 1 / span 4; text-align: right; display: flex; flex-direction: column; gap: 2px; align-items: flex-end; font-variant-numeric: tabular-nums; }
.pv { font-size: 19px; font-weight: 700; white-space: nowrap; }
.pl { font-size: 14px; font-weight: 400; color: var(--muted); margin-inline-end: 6px; }
.tag { font-size: 14px; color: var(--muted); white-space: nowrap; }
.notes { margin: 36px 0 0; padding: 0; list-style: none; display: grid; gap: 6px; font-size: 15px; color: var(--muted); }
html{color-scheme:light}
@media (prefers-color-scheme: dark){html{color-scheme:dark}}
body{margin:0}
</style>

var current = 'en';

function pickInitial() {
  var h = (location.hash || '').replace('#', '');
  for (var i = 0; i < LANGS.length; i++) { if (LANGS[i].code === h) return h; }
  try {
    var saved = localStorage.getItem('gbrick-menu-lang');
    for (var j = 0; j < LANGS.length; j++) { if (LANGS[j].code === saved) return saved; }
  } catch (e) {}
  var nav = ((navigator.languages && navigator.languages[0]) || navigator.language || 'en').slice(0, 2).toLowerCase();
  for (var k = 0; k < LANGS.length; k++) { if (LANGS[k].code === nav) return nav; }
  return 'en';
}

function esc(s) {
  return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; });
}
function won(n) { return '₩' + n.toLocaleString('en-US'); }

function priceHtml(it) {
  var L = current;
  if (it.p) return '<span class="pv">' + won(it.p) + '</span>';
  if (it.h && it.i && it.h === it.i) return '<span class="pv">' + won(it.h) + '</span><span class="tag">' + esc(UI.both[L]) + '</span>';
  if (it.h && it.i) {
    return '<span class="pv"><span class="pl">' + esc(UI.hot[L]) + '</span>' + won(it.h) + '</span>' +
           '<span class="pv"><span class="pl">' + esc(UI.iced[L]) + '</span>' + won(it.i) + '</span>';
  }
  if (it.i) return '<span class="pv">' + won(it.i) + '</span><span class="tag">' + esc(UI.icedOnly[L]) + '</span>';
  if (it.h) return '<span class="pv">' + won(it.h) + '</span><span class="tag">' + esc(UI.hotOnly[L]) + '</span>';
  return '';
}

function render() {
  var L = current;
  document.documentElement.lang = L;
  document.getElementById('store').textContent = UI.store[L];

  document.getElementById('langs').innerHTML = LANGS.map(function (l) {
    return '<li><button type="button" data-lang="' + l.code + '" lang="' + l.code + '" aria-pressed="' + (l.code === L) + '">' + esc(l.label) + '</button></li>';
  }).join('');

  document.getElementById('jump').innerHTML = CATS.map(function (c) {
    return '<li><button type="button" data-cat="' + c.id + '">' + esc(c.n[L]) + '</button></li>';
  }).join('');

  var html = '';
  CATS.forEach(function (c) {
    var rows = ITEMS.filter(function (it) { return it.c === c.id; });
    if (!rows.length) return;
    html += '<h2 class="cat" id="cat-' + c.id + '">' + esc(c.n[L]) + '</h2><ul class="items">';
    rows.forEach(function (it) {
      html += '<li class="item"><span class="name">' + esc(it.n[L]) + '</span>';
      if (L !== 'ko') html += '<span class="ko" lang="ko">' + esc(it.n.ko) + '</span>';
      if (it.d) html += '<span class="desc">' + esc(it.d[L]) + '</span>';
      if (it.s) html += '<span class="season">' + esc(UI[it.s][L]) + '</span>';
      var p = priceHtml(it);
      if (p) html += '<span class="prices">' + p + '</span>';
      html += '</li>';
    });
    html += '</ul>';
  });
  document.getElementById('menu').innerHTML = html;
  document.getElementById('notes').innerHTML = UI.notes.map(function (n) { return '<li>' + esc(n[L]) + '</li>'; }).join('');
}

function setLang(code) {
  current = code;
  try { localStorage.setItem('gbrick-menu-lang', code); } catch (e) {}
  render();
}

document.getElementById('langs').addEventListener('click', function (e) {
  var b = e.target.closest ? e.target.closest('button[data-lang]') : null;
  if (b) setLang(b.getAttribute('data-lang'));
});
document.getElementById('jump').addEventListener('click', function (e) {
  var b = e.target.closest ? e.target.closest('button[data-cat]') : null;
  if (!b) return;
  var el = document.getElementById('cat-' + b.getAttribute('data-cat'));
  if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
});
window.addEventListener('hashchange', function () {
  var h = (location.hash || '').replace('#', '');
  for (var i = 0; i < LANGS.length; i++) { if (LANGS[i].code === h) { setLang(h); return; } }
});

current = pickInitial();
render();
</script>
