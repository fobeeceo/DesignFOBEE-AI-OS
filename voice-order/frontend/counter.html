<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>카운터 · GBRICK 음성 주문</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="counter.css" />
</head>
<body class="counter-body">
  <div class="counter">
    <header class="c-top">
      <div>
        <div class="c-brand">GBRICK COFFEE · 카운터</div>
        <div class="c-store" id="store-name">매장 주문 화면</div>
      </div>
      <div class="c-right">
        <span class="mode-tag" id="mode-tag" hidden></span>
        <span class="conn" id="conn">연결 확인 중…</span>
        <button class="mini" id="sound-btn" type="button">🔈 알림 소리 켜기</button>
      </div>
    </header>

    <p class="c-test" id="test-banner" hidden>TEST 모드 — 연습 주문입니다. 실제 매출이 아니며, 제조·결제하지 않습니다.</p>

    <section id="help-area" aria-live="assertive"></section>

    <h2 class="c-h">진행 중 주문 <span id="active-count"></span></h2>
    <div class="cards" id="active"><p class="c-empty">자바스크립트가 켜져 있어야 주문이 표시됩니다.</p></div>

    <h2 class="c-h">오늘 끝난 주문</h2>
    <div class="done-list" id="done"></div>

    <h2 class="c-h">오늘 현황 <small>(실제 기록으로만 계산 · 기록이 없으면 -)</small></h2>
    <div class="kpis" id="kpis"></div>
  </div>

  <div id="print-area" aria-hidden="true"></div>
  <script type="module" src="counter.js"></script>
</body>
</html>
